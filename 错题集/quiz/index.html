<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>408 错题集 · 在线刷题</title>
<style>
  body{margin:0;background:#f3f5f8;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1f2937}
  .wrap{max-width:760px;margin:0 auto;padding:24px}
  h1{font-size:22px;margin:0 0 4px}
  .meta{color:#6b7280;font-size:13px;margin-bottom:18px}
  .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
  .q{font-size:17px;font-weight:600;margin-bottom:14px}
  .opt{border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin:10px 0;cursor:pointer;transition:.15s;background:#fafafa}
  .opt:hover{border-color:#2563eb;background:#eff6ff}
  .opt.correct{border-color:#16a34a;background:#ecfdf5;color:#15803d}
  .opt.wrong{border-color:#dc2626;background:#fef2f2;color:#b91c1c}
  .opt.disabled{cursor:default;opacity:.85}
  .badge{font-weight:700;margin-right:8px}
  .analysis{margin-top:14px;border-top:1px dashed #e5e7eb;padding-top:12px;display:none}
  .btn{margin-top:16px;padding:9px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
  .btn:disabled{background:#94a3b8;cursor:not-allowed}
  .log{margin-top:20px;font-size:13px;color:#475569}
</style>
</head>
<body>
<div class="wrap">
  <h1>📕 408 在线刷题</h1>
  <div class="meta">单选题点击选项即判分；多选题勾选后点击“提交答案”。</div>
  <div class="card" id="quizCard"></div>
  <div class="log" id="log"></div>
</div>
<script>
const SUBJECT_DIRS = { '计算机网络': '计算机网络' };
let questions = [];
let idx = 0;
let wrongLog = [];

const GROUP_SIZE = 5;
let groupStart = 0;

async function init() {
  const res = await fetch('./questions.json');
  questions = await res.json();
  render();
}

function saveWrong(q) {
  wrongLog.push({ id:q.id, subject:q.subject, topic:q.topic, question:q.question, selected:q.lastSelection, answer:q.answer, time:new Date().toISOString() });
  localStorage.setItem('ky_wrong_log', JSON.stringify(wrongLog));
  document.getElementById('log').textContent = `已记入错题集：${q.subject} / ${q.topic}`;
}

function isCorrect(q, selected) {
  if (q.type === 'multi') {
    return Array.isArray(selected) && selected.length === q.answer.length &&
      q.answer.every(a => selected.includes(a));
  }
  return selected === q.answer;
}

function render() {
  const card = document.getElementById('quizCard');
  const log = document.getElementById('log');
  log.textContent = '';
  if (idx >= questions.length) {
    const wrongItems = wrongLog.map(x => `${x.id} · ${x.topic} · 正确答案 ${Array.isArray(x.answer)?x.answer.join('、'):x.answer}`).join('<br>');
    card.innerHTML = `<div class="q">本组题目已完成 ✅</div><p>共 ${questions.length} 题，答错 ${wrongLog.length} 题。</p><div>${wrongItems}</div>`;
    log.textContent = wrongLog.length ? '本次错题已记录：' + wrongLog.map(x => x.id).join(', ') : '本次全部答对，无需归档。';
    return;
  }
  const q = questions[idx];
  card.innerHTML = `
    <div class="meta">第 ${idx - groupStart + 1} / ${Math.min(GROUP_SIZE, questions.length - groupStart)} 题 · ${q.subject} · ${q.topic} · ${q.type === 'multi' ? '多选' : '单选'}</div>
    <div class="q">${q.question}</div>
    <div id="options"></div>
    ${q.type === 'multi' ? '<button class="btn" id="submitBtn" disabled>提交答案</button>' : ''}
    <div class="analysis" id="analysis"></div>
    <button class="btn" id="nextBtn" style="display:none">下一题</button>
  `;

  const optionsEl = card.querySelector('#options');
  const letters = Object.keys(q.options).sort();
  let selected = q.type === 'multi' ? [] : null;
  const submitBtn = card.querySelector('#submitBtn');
  const nextBtn = card.querySelector('#nextBtn');

  letters.forEach(letter => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.letter = letter;
    div.innerHTML = `<span class="badge">${letter}</span>${q.options[letter]}`;
    div.onclick = () => {
      if (q.type === 'single') {
        selected = letter;
        judge(q, selected);
      } else {
        const i = selected.indexOf(letter);
        if (i === -1) selected.push(letter); else selected.splice(i,1);
        div.classList.toggle('selected', i === -1);
        div.style.borderColor = selected.includes(letter) ? '#2563eb' : '#e5e7eb';
        div.style.background = selected.includes(letter) ? '#eff6ff' : '#fafafa';
        submitBtn.disabled = selected.length === 0;
      }
    };
    optionsEl.appendChild(div);
  });

  if (submitBtn) submitBtn.onclick = () => judge(q, [...selected].sort());

  function judge(q, sel) {
    q.lastSelection = sel;
    const ok = isCorrect(q, sel);
    optionsEl.querySelectorAll('.opt').forEach(el => {
      const l = el.dataset.letter;
      const correct = q.type === 'multi' ? q.answer.includes(l) : l === q.answer;
      if (correct) el.classList.add('correct');
      else if ((q.type === 'multi' ? sel.includes(l) : sel === l)) el.classList.add('wrong');
      el.classList.add('disabled');
      el.onclick = null;
    });
    const analysisEl = card.querySelector('#analysis');
    analysisEl.style.display = 'block';
    analysisEl.innerHTML = `<p><b>${ok ? '✅ 回答正确' : '❌ 回答错误'}</b>　正确答案：${Array.isArray(q.answer)?q.answer.join('、'):q.answer}</p><p>${q.analysis}</p>`;
    if (!ok) saveWrong(q);
    nextBtn.style.display = 'inline-block';
  }

  nextBtn.onclick = () => { idx++; if (idx - groupStart >= GROUP_SIZE || idx >= questions.length) { groupStart = idx; } render(); };
}

init();
</script>
</body>
</html>
