<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>计算机考研 · 在线刷题</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/katex/auto-render.min.js"></script>
<style>
  body{margin:0;background:#f3f5f8;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#1f2937}
  .wrap{max-width:760px;margin:0 auto;padding:24px}
  h1{font-size:22px;margin:0 0 4px}
  .meta{color:#6b7280;font-size:13px;margin-bottom:18px}
  .card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(15,23,42,.06)}
  .q{font-size:17px;font-weight:600;margin-bottom:14px;line-height:1.5}
.q pre{background:#1e293b;color:#e2e8f0;border-radius:8px;padding:12px 14px;margin:10px 0;overflow-x:auto;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.6;font-weight:400}
.q code{font-family:Consolas,Menlo,monospace}
  .opt{border:1px solid #e5e7eb;border-radius:10px;padding:12px 14px;margin:10px 0;cursor:pointer;transition:.15s;background:#fafafa}
  .opt:hover{border-color:#2563eb;background:#eff6ff}
  .opt.correct{border-color:#16a34a;background:#ecfdf5;color:#15803d}
  .opt.wrong{border-color:#dc2626;background:#fef2f2;color:#b91c1c}
  .opt.disabled{cursor:default;opacity:.85}
  .badge{font-weight:700;margin-right:8px}
  .analysis{margin-top:14px;border-top:1px dashed #e5e7eb;padding-top:12px;display:none}
  .btn{margin-top:16px;padding:9px 16px;border-radius:8px;border:none;background:#2563eb;color:#fff;cursor:pointer;font-size:14px}
  .btn:disabled{background:#94a3b8;cursor:not-allowed}
  .log{margin-top:20px;font-size:13px;color:#475569}
  .learn-card{border:1px solid #dbeafe;border-left:5px solid #2563eb;background:#f8fafc;border-radius:12px;padding:18px;margin-bottom:14px}
  .learn-card h2{margin:0 0 10px;font-size:18px;color:#1d4ed8}
  .learn-card h3{margin:14px 0 6px;font-size:15px;color:#1e40af}
  .learn-card p{line-height:1.75;margin:0}
  .learn-card ul{margin:8px 0 0;padding-left:20px;line-height:1.7}
  .learn-mnemonic{margin-top:12px;padding:12px 14px;border-left:5px solid #7c3aed;background:#f5f3ff;border-radius:10px;font-weight:600;color:#5b21b6}
</style>
</head>
<body>
<div class="wrap">
  <h1>📕 计算机考研 · 新错题练习</h1>
  <div class="meta">单选题点击选项即判分；多选题勾选后点击“提交答案”。新错题练习区。把错题发给助手后会自动生成题目到这里；复习题在 4318 端口。</div>
  <div class="card" id="quizCard"></div>
  <div class="log" id="log"></div>
</div>
<script>
let questions = [];
let knowledgeBase = {};
let studyStarted = false;
let idx = 0;
let answered = [];
let roundId = 'quiz-' + Date.now();

async function init() {
  const [qRes, kbRes] = await Promise.all([
    fetch('./questions.json', { cache: 'no-store' }),
    fetch('./knowledge.json', { cache: 'no-store' })
  ]);
  questions = await qRes.json();
  knowledgeBase = await kbRes.json();
  render();
}

function report(q, sel, ok) {
  answered.push({ id: q.id, selected: sel, answer: q.answer, correct: ok, at: new Date().toISOString() });
  fetch('/api/answer', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ roundId, id: q.id, subject: q.subject, topic: q.topic, question: q.question, options: q.options, selected: sel, answer: q.answer, correct: ok, at: new Date().toISOString() })
  }).catch(() => {});
}

function toMathQuiz(tex){
  return tex
    .replace(/log_\{?2\}?/g,'\\log_{2}')
    .replace(/log_\{?3\}?/g,'\\log_{3}')
    .replace(/log\(?2\)? n/g,'\\log_{2} n')
    .replace(/log\(?3\)? n/g,'\\log_{3} n')
    .replace(/sqrt/g,'\\sqrt')
    .replace(/\^\{?\(1\/2\)\}?/g,'^{1/2}')
    .replace(/\^\{?\(1\/3\)\}?/g,'^{1/3}')
    .replace(/\^\{?\(2\/3\)\}?/g,'^{2/3}')
    .replace(/\^\{?\(3\/2\)\}?/g,'^{3/2}')
    .replace(/\^2/g,'^{2}');
}
function katexO(inner){
  try{
    return katex.renderToString('O(' + toMathQuiz(inner) + ')',{throwOnError:false,output:'html'});
  }catch(e){
    return 'O(' + inner + ')';
  }
}
function renderQuestion(text) {
  const LNBREAK = '\\n';
  const FENCE = '```';
  let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const parts = html.split(FENCE);
  let out = "";
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 1) {
      const codeLines = parts[i].split(LNBREAK).join(String.fromCharCode(10));
      const code = codeLines.replace(/^[a-zA-Z0-9]+\n/, '');
      out += '<pre><code>' + code + '</code></pre>';
    } else {
      let seg = parts[i].split(LNBREAK).join('<br>');
      seg = seg.replace(/O\(([^)<]+)\)/g, function(m,inner){
        return katexO(inner);
      });
      out += seg;
    }
  }
  return out;
}

function findKnowledgeEntry(q) {
  if (q.itemId && knowledgeBase[q.itemId]) return knowledgeBase[q.itemId];
  const topic = q.topic || "";
  for (const [itemId, entry] of Object.entries(knowledgeBase)) {
    const causes = entry.rootCauses || {};
    if (topic in causes || Object.keys(causes).some(key => topic.includes(key) || key.includes(topic))) return entry;
  }
  return null;
}

function isCorrect(q, sel) {
  if (q.type === 'multi') {
    return Array.isArray(sel) && sel.length === q.answer.length && q.answer.every(a => sel.includes(a));
  }
  return sel === q.answer;
}

function render() {
  const entry = findKnowledgeEntry(questions[idx]);
  if (entry && !answered.some(a => a.id === questions[idx].id)) {
    renderStudy(entry);
    return;
  }
  renderQuiz();
}

function renderStudy(entry) {
  const card = document.getElementById("quizCard");
  const q = questions[idx];
  const title = Object.keys(knowledgeBase).find(key => knowledgeBase[key] === entry) || "本组错题";
  const causes = entry.rootCauses || {};
  const relatedCause = Object.entries(causes).find(([key]) => q.topic.includes(key) || key.includes(q.topic));
  const causeList = relatedCause ? [relatedCause] : Object.entries(causes);
  card.innerHTML = [
    "<div class=\"learn-card\">",
    "<h2>📚 答题前强化学习 · 第 " + (idx + 1) + " 题</h2>",
    "<h3>知识点：" + title + "</h3>",
    "<h3>根因分析</h3>",
    causeList.map(([name, value]) => "<p><b>" + name + "：</b>" + renderQuestion(value) + "</p>").join(""),
    "<h3>完整知识点梳理</h3>",
    "<p>" + renderQuestion(entry.knowledge || "") + "</p>",
    "<h3>关键点</h3>",
    "<ul>" + (entry.keyPoints || []).map(item => "<li>" + renderQuestion(item) + "</li>").join("") + "</ul>",
    entry.mnemonic ? "<div class=\"learn-mnemonic\">🧠 记忆口诀：" + renderQuestion(entry.mnemonic) + "</div>" : "",
    "<button class=\"btn\" id=\"startQuizBtn\">我已阅读，开始答题</button>",
    "</div>"
  ].join("");
  card.querySelector("#startQuizBtn").onclick = () => renderQuiz();
  if(window.renderMathInElement)renderMathInElement(card,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
}

function renderQuiz() {
  const card = document.getElementById('quizCard');
  const log = document.getElementById('log');
  log.textContent = '';
  if (idx >= questions.length) {
    const wrong = answered.filter(a => !a.correct);
    card.innerHTML = `<div class="q">本组题目已完成 ✅</div><p>共 ${answered.length} 题，答错 ${wrong.length} 题。</p><p>${wrong.map(w => w.id + ' · ' + (Array.isArray(w.answer) ? w.answer.join('、') : w.answer)).join('<br>')}</p><p>已上报，刷新页面可重新练习。</p>`;
    log.textContent = '结果已保存到服务端。';
    return;
  }
  const q = questions[idx];
  card.innerHTML = `
    <div class="meta">第 ${idx + 1} / ${questions.length} 题 · ${q.subject} · ${q.topic} · ${q.type === 'multi' ? '多选' : '单选'}</div>
    <div class="q">${renderQuestion(q.question)}</div>
    <div id="options"></div>
    ${q.type === 'multi' ? '<button class="btn" id="submitBtn" disabled>提交答案</button>' : ''}
    <div class="analysis" id="analysis"></div>
    <button class="btn" id="nextBtn" style="display:none">下一题</button>
  `;

  const optionsEl = card.querySelector('#options');
  const letters = Object.keys(q.options).sort();
  let selected = q.type === 'multi' ? [] : null;
  const submitBtn = card.querySelector('#submitBtn');
  const nextBtn = card.querySelector('#nextBtn');

  letters.forEach(letter => {
    const div = document.createElement('div');
    div.className = 'opt';
    div.dataset.letter = letter;
    div.innerHTML = `<span class="badge">${letter}</span>${renderQuestion(q.options[letter])}`;
    div.onclick = () => {
      if (q.type === 'single') {
        judge(letter);
      } else {
        const i = selected.indexOf(letter);
        if (i === -1) selected.push(letter); else selected.splice(i, 1);
        div.style.borderColor = selected.includes(letter) ? '#2563eb' : '#e5e7eb';
        div.style.background = selected.includes(letter) ? '#eff6ff' : '#fafafa';
        submitBtn.disabled = selected.length === 0;
      }
    };
    optionsEl.appendChild(div);
  });

  if (submitBtn) submitBtn.onclick = () => judge([...selected].sort());

  function judge(sel) {
    const ok = isCorrect(q, sel);
    optionsEl.querySelectorAll('.opt').forEach(el => {
      const l = el.dataset.letter;
      const isRight = q.type === 'multi' ? q.answer.includes(l) : l === q.answer;
      const picked = q.type === 'multi' ? sel.includes(l) : sel === l;
      if (isRight) el.classList.add('correct');
      else if (picked) el.classList.add('wrong');
      el.classList.add('disabled');
      el.onclick = null;
    });
    const analysisEl = card.querySelector('#analysis');
    analysisEl.style.display = 'block';
    analysisEl.innerHTML = `<p><b>${ok ? '✅ 回答正确' : '❌ 回答错误'}</b>　正确答案：${Array.isArray(q.answer) ? q.answer.join('、') : q.answer}</p><p>${renderQuestion(q.analysis)}</p>`;
    if(window.renderMathInElement)renderMathInElement(analysisEl,{delimiters:[{left:'$',right:'$',display:false}],throwOnError:false});
    report(q, sel, ok);
    log.textContent = ok ? '已记录：本题答对。' : '已记录：本题答错，将进入错题集。';
    nextBtn.style.display = 'inline-block';
  }

  nextBtn.onclick = () => { idx++; render(); };
  if(window.renderMathInElement)renderMathInElement(card, {delimiters:[{left:'\$',right:'\$',display:false}],throwOnError:false});
}

const KATEX_OPTS={delimiters:[{left:'\$',right:'\$',display:false}],throwOnError:false};function typesetMath(){if(window.renderMathInElement)renderMathInElement(document.body,KATEX_OPTS);}init().then(typesetMath);
</script>
</body>
</html>
