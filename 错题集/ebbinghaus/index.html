<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>计算机考研 · 艾宾浩斯记忆中心</title>
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#0b1220;--border:#334155;--text:#e2e8f0;--muted:#94a3b8;--muted2:#64748b;--blue:#60a5fa;--green:#4ade80;--orange:#fb923c;--purple:#c084fc;--red:#f87171}
html[data-theme="light"]{--bg:#f1f5f9;--bg2:#ffffff;--bg3:#e2e8f0;--border:#cbd5e1;--text:#1e293b;--muted:#475569;--muted2:#64748b;--blue:#2563eb;--green:#16a34a;--orange:#ea580c;--purple:#9333ea;--red:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Microsoft YaHei",sans-serif;min-height:100vh;transition:background .25s,color .25s}
.topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar h1{font-size:18px;font-weight:700}
.topbar .badge{font-size:12px;color:var(--muted)}
.topbar .spacer{flex:1}
.theme-btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.theme-btn:hover{border-color:var(--blue);transform:translateY(-1px)}
.wrap{max-width:1200px;margin:0 auto;padding:24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{position:relative;overflow:hidden;background:var(--bg2);border-radius:14px;padding:20px 22px;border:1px solid var(--border);transition:transform .2s,box-shadow .2s,border-color .2s}
.stat::before{content:"";position:absolute;left:0;top:0;width:3px;height:100%;background:currentColor;opacity:.9}
.stat::after{content:"";position:absolute;right:-40px;top:-40px;width:120px;height:120px;border-radius:50%;background:currentColor;opacity:.07;filter:blur(6px)}
.stat:hover{transform:translateY(-3px);border-color:currentColor;box-shadow:0 10px 24px rgba(0,0,0,.14)}
.stat.orange{color:var(--orange)}.stat.blue{color:var(--blue)}.stat.green{color:var(--green)}.stat.purple{color:var(--purple)}
.stat-top{display:flex;align-items:center;gap:9px;position:relative;z-index:1}
.stat-ico{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;background:currentColor;flex:0 0 auto}
.stat-ico span{filter:brightness(0) invert(1);opacity:.95}
.stat-label{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.4px}
.stat .num{position:relative;z-index:1;font-size:38px;font-weight:800;line-height:1.05;margin-top:14px;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.stat .unit{font-size:13px;font-weight:700;opacity:.6;margin-left:5px;letter-spacing:0}
.stat-hint{position:relative;z-index:1;margin-top:6px;font-size:11.5px;color:var(--muted2);font-weight:600}
.section{background:var(--bg2);border-radius:12px;border:1px solid var(--border);margin-bottom:18px;overflow:hidden}
.section h2{font-size:14px;padding:16px 20px;border-bottom:1px solid var(--border);color:var(--muted);font-weight:700;text-align:center;letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:13px 14px;text-align:center;color:var(--muted2);font-weight:700;border-bottom:1px solid var(--border);background:var(--bg3);font-size:12px;letter-spacing:.5px}
td{padding:13px 14px;border-bottom:1px solid var(--border);text-align:center}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--bg3)}
.tag{display:inline-block;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.mastered{background:rgba(74,222,128,.16);color:var(--green)}
.tag.learning{background:rgba(96,165,250,.16);color:var(--blue)}
.tag.due{background:rgba(251,146,60,.16);color:var(--orange)}
.btn{padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.btn.primary{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{border-color:var(--red);color:var(--red)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.filters input,.filters select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-size:13px;outline:none;width:100%}
.filters input:focus,.filters select:focus{border-color:var(--blue)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;flex-wrap:wrap}
.pager button{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:12px;font-weight:600}
.pager button:disabled{opacity:.35;cursor:not-allowed}
.pager button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.pager select,.pager input{background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px}
.pager input{width:58px;text-align:center}
.pager .info{color:var(--muted);font-size:12px;font-weight:600}
.curve-box{padding:26px 22px 12px}
.curve-svg{display:block;width:100%;height:auto;overflow:visible}
.quiz-bar{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(37,99,235,.10),rgba(147,51,234,.10));border:1px solid var(--border);border-radius:14px;padding:22px 28px;margin-bottom:20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.quiz-bar::before{content:"";position:absolute;left:-60px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(37,99,235,.08);filter:blur(10px)}
.quiz-bar .info{flex:1;min-width:220px}
.quiz-bar .title{font-size:17px;font-weight:800;margin-bottom:7px;display:flex;align-items:center;gap:9px;letter-spacing:.4px}
.quiz-bar .title .pct{font-size:11px;font-weight:700;padding:3px 10px;border-radius:12px;background:rgba(37,99,235,.14);color:var(--blue);letter-spacing:.5px}
.quiz-bar .desc{font-size:13px;color:var(--muted);line-height:1.6}
.btn-lg{padding:12px 28px;border-radius:10px;border:none;background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;cursor:pointer;font-size:15px;font-weight:700;transition:.2s}
.btn-lg:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 22px rgba(37,99,235,.4)}
.btn-lg:disabled{background:var(--border);color:var(--muted2);cursor:not-allowed}
.btn-lg.alt{background:linear-gradient(135deg,#0891b2,#2563eb)}
#quizCard{max-width:700px;margin:0 auto;padding:26px}
.opt{border:none;border-radius:10px;padding:14px 16px;margin:10px 0;cursor:pointer;transition:.15s;font-size:14px}
.opt:hover{border-color:var(--blue);background:rgba(37,99,235,.08)}
.opt.correct{border-color:var(--green);background:rgba(74,222,128,.12);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12);color:var(--red)}
.opt.disabled{cursor:default;opacity:.92}
.opt .badge{font-weight:800;margin-right:10px}
.analysis{margin-top:16px;border-top:1px dashed var(--border);padding-top:14px;display:none;font-size:13px;line-height:1.75;color:var(--muted)}
.analysis-block{margin-bottom:14px}
.analysis-block h4{font-size:12px;color:var(--blue);margin-bottom:6px;letter-spacing:.5px;font-weight:800}
.analysis-block p,.analysis-block li{font-size:13px;color:var(--muted);line-height:1.75}
.analysis-block ul{padding-left:18px;list-style:disc}
.analysis-mnemonic{background:rgba(147,51,234,.1);border-left:3px solid var(--purple);border-radius:6px;padding:10px 14px;font-size:12.5px;color:var(--purple);font-weight:600;margin-bottom:14px}
.analysis-kp{background:rgba(37,99,235,.06);border-radius:8px;padding:10px 14px;border:1px solid var(--border)}
.side-panel{position:fixed;right:0;top:0;bottom:0;width:230px;background:var(--bg2);border-left:1px solid var(--border);padding:18px 14px;overflow-y:auto;z-index:50}
.side-panel h3{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:14px;letter-spacing:.5px}
.side-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.side-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1.5px solid var(--border);font-size:12px;font-weight:700;color:var(--muted2);cursor:pointer;transition:.15s;background:var(--bg3)}
.side-cell:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
.side-cell.active{outline:2px solid var(--blue);outline-offset:1px;color:var(--blue)}
.side-cell.correct{background:rgba(74,222,128,.16);border-color:var(--green);color:var(--green)}
.side-cell.wrong{background:rgba(248,113,113,.16);border-color:var(--red);color:var(--red)}
.side-legend{display:flex;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted2);flex-wrap:wrap}
.side-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}
.side-legend i.ok{background:rgba(74,222,128,.5);border:1px solid var(--green)}
.side-legend i.no{background:rgba(248,113,113,.5);border:1px solid var(--red)}
.side-legend i.todo{background:var(--bg3);border:1px solid var(--border)}
.side-status.correct{background:rgba(74,222,128,.2);border-color:var(--green);color:var(--green)}
.side-status.wrong{background:rgba(248,113,113,.2);border-color:var(--red);color:var(--red)}
.side-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.main-with-side{margin-right:230px;max-width:none;width:auto}
#quizView #quizCard{width:85%;max-width:85%;margin:24px auto}
.nav-bar{display:flex;gap:12px;margin:18px 0;justify-content:space-between}
.nav-bar .btn{flex:1;padding:11px 0;font-size:14px;font-weight:700;border-radius:9px;cursor:pointer;transition:.15s}
.nav-bar .btn-prev{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.nav-bar .btn-prev:hover{border-color:var(--blue);color:var(--blue)}
.nav-bar .btn-next2{background:var(--blue);color:#fff;border:none}
.nav-bar .btn-next2:hover{background:#3b82f6;transform:translateY(-1px)}
.nav-bar .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.q{font-size:16px;font-weight:600;margin-bottom:16px;line-height:1.75}
.q pre{background:var(--bg3);color:var(--blue);border-radius:8px;padding:14px 16px;margin:12px 0;overflow-x:auto;font-family:Consolas,Menlo,monospace;font-size:13px;line-height:1.65;font-weight:400;border:1px solid var(--border)}
.q code{font-family:Consolas,Menlo,monospace;background:rgba(96,165,250,.12);padding:2px 6px;border-radius:4px}
.q pre code{background:none;padding:0}
.meta{color:var(--muted2);font-size:12px;margin-bottom:16px;text-align:center;font-weight:600}
.log{margin-top:16px;font-size:13px;color:var(--muted);min-height:20px;text-align:center}
.empty{padding:44px;text-align:center;color:var(--muted2);font-size:13px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="topbar">
  <h1 style="cursor:pointer" onclick="exitQuiz()">🧠 计算机考研 · 艾宾浩斯记忆中心</h1>
  <span class="badge" id="todayBadge"></span>
  <div class="spacer"></div>
  <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙 深色</button>
</div>
<div class="wrap" id="mainView">
  <div class="stats" id="stats"></div>
  <div class="quiz-bar">
    <div class="info">
      <div class="title">🎯 今日复习任务 <span class="pct" id="duePct"></span></div>
      <div class="desc" id="quizDesc">加载中…</div>
    </div>
    <button class="btn-lg" id="startBtn">开始复习</button>
    <button class="btn-lg alt" id="forceBtn">全部练习</button>
  </div>
  <div class="section">
    <h2>📊 记忆保持曲线 · 艾宾浩斯遗忘曲线</h2>
    <div class="curve-box"><svg id="curveSvg" class="curve-svg" viewBox="0 0 960 300"></svg></div>
  </div>
  <div class="section">
    <h2>📚 全部知识点</h2>
    <div class="filters">
      <input id="fKeyword" placeholder="🔍 搜索知识点…" oninput="page=1;renderAll()">
      <select id="fSubject" onchange="page=1;renderAll()"></select>
      <select id="fStatus" onchange="page=1;renderAll()">
        <option value="">全部状态</option>
        <option value="learning">学习中</option>
        <option value="mastered">已掌握</option>
        <option value="due">今日到期</option>
      </select>
      <select id="fReviews" onchange="page=1;renderAll()">
        <option value="0">复习次数 全部</option>
        <option value="1">复习 ≥ 1 次</option>
        <option value="2">复习 ≥ 2 次</option>
        <option value="3">复习 ≥ 3 次</option>
      </select>
      <button class="btn ghost" onclick="clearFilters()">清空</button>
    </div>
    <table>
      <thead><tr><th>知识点</th><th>科目</th><th>状态</th><th>题目数量</th><th>轮次</th><th>下次到期</th><th>已复习</th><th>操作</th></tr></thead>
      <tbody id="allBody"></tbody>
    </table>
    <div class="pager" id="pager"></div>
  </div>
</div>
<div id="quizView" style="display:none">
  <div class="wrap main-with-side">
    <div id="quizCard"></div>
    <div class="log" id="quizLog"></div>
  </div>
  <div class="side-panel">
    <h3>📋 答题状态</h3>
    <div class="side-grid" id="sideList"></div>
    <div class="side-legend"><span><i class="ok"></i>答对</span><span><i class="no"></i>答错</span><span><i class="todo"></i>未答</span></div>
  </div>
</div>
<script>

</script>
<script src="app.js"></script>
